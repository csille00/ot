[package]
name = "ot"
version = "0.1.0"
edition = "2021"

[dependencies]
jiff = "0.2"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seam-core = { path = "seam-core" }
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }
sha1_smol = "1.0.1"

[dev-dependencies]
insta = "1"

[profile.release]
debug = false
lto = "thin"
