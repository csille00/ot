[package]
name = "ot"
version = "0.1.0"
edition = "2021"

[dependencies]
jiff = "0.2"
ratatui = "0.30"
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
seam-core = { path = "seam-core" }
unicode-width = "0.2"
ureq = { version = "3", features = ["json"] }
sha1_smol = "1.0.1"

[dev-dependencies]
insta = "1"

[profile.release]
debug = false
lto = "thin"
