[package]
name = "seam-core"
version = "0.0.0"
edition = "2021"

[dependencies]
ast-grep-core = "0.45.3"
ast-grep-config = "0.45.3"
ast-grep-language = { version = "0.45.3", default-features = false, features = ["tree-sitter-typescript", "tree-sitter-rust", "tree-sitter-python"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
